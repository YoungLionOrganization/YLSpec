name: Check inherited publishing secrets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check availability without exposing values or contacting registries
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python - <<'PY'
          import os
          names = ('MAVEN_CENTRAL_USERNAME', 'MAVEN_CENTRAL_PASSWORD',
                   'MAVEN_GPG_PRIVATE_KEY', 'MAVEN_GPG_PASSPHRASE', 'NPM_TOKEN', 'PYPI_API_TOKEN')
          missing = [name for name in names if not os.environ.get(name)]
          for name in names:
              print(f'{name}: {"MISSING" if name in missing else "available"}')
          if missing:
              raise SystemExit('Organization secrets must allow access to this repository: ' + ', '.join(missing))
          print('Availability verified. No secret values were logged and no package was published.')
          PY
