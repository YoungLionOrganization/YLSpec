name: Publish Maven Central libraries
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published GitHub Release version; empty uses release/release.json'
        required: false
        type: string
permissions: {contents: read}
concurrency: {group: ylspec-maven-publish, cancel-in-progress: false}
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.13'}
      - name: Require main
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Download and verify the published release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: python scripts/publish_registry.py prepare-maven
      - name: Sign unchanged binaries and publish the Central bundle
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          test -n "$MAVEN_CENTRAL_USERNAME" && test -n "$MAVEN_CENTRAL_PASSWORD" && test -n "$MAVEN_GPG_PRIVATE_KEY" || { echo '::error::Configure the Maven Central token and OpenPGP secrets.'; exit 1; }
          python scripts/publish_registry.py central
