name: Publish npm package
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published GitHub Release version; empty uses release/release.json'
        required: false
        type: string
permissions: {contents: read}
concurrency: {group: ylspec-npm-publish, cancel-in-progress: false}
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.13'}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24', registry-url: 'https://registry.npmjs.org'}
      - name: Require main and configured token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test -n "$NPM_TOKEN" || { echo '::error::Add the NPM_TOKEN repository secret.'; exit 1; }
      - name: Download and verify the published release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: python scripts/publish_registry.py prepare-npm
      - name: Publish the verified npm tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "$REGISTRY_ASSET" --access public --ignore-scripts
