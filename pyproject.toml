[build-system]
requires = ["scikit-build-core>=0.11,<1"]
build-backend = "scikit_build_core.build"

[project]
name = "ylspec"
dynamic = ["version"]
description = "Portable, standalone and embeddable metadata documents backed by a C core"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "vendor/tomlc17/LICENSE"]
authors = [{name = "Cavanşir Qurbanzadə", email = "cavanshirpro@gmail.com"}]
maintainers = [{name = "Cavanşir Qurbanzadə", email = "cavanshirpro@gmail.com"}]
keywords = ["ylspec", "metadata", "manifest", "configuration", "embedding", "toml"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: C", "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Operating System :: Microsoft :: Windows", "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS", "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/YoungLionOrganization/YLSpec"
Documentation = "https://github.com/YoungLionOrganization/YLSpec/tree/main/docs"
Issues = "https://github.com/YoungLionOrganization/YLSpec/issues"
Changelog = "https://github.com/YoungLionOrganization/YLSpec/blob/main/CHANGELOG.md"

[tool.scikit-build]
minimum-version = "0.11"
wheel.packages = ["python/ylspec"]
wheel.py-api = "cp311"
install.components = ["python"]
cmake.args = ["-DYLSPEC_BUILD_PYTHON=ON", "-DYLSPEC_BUILD_CLI=OFF", "-DBUILD_TESTING=OFF", "-DBUILD_SHARED_LIBS=OFF"]
sdist.include = ["include/**", "src/**", "vendor/**", "release/**", "cmake/**", "tests/**", "examples/**", "python/**", "CMakeLists.txt", "LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "release/release.json"
regex = '"version":\s*"(?P<value>[^"]+)"'

[tool.cibuildwheel]
build = ["cp311-*"]
skip = ["*-win32", "*-manylinux_i686", "*-musllinux_i686", "*-win_arm64"]
test-requires = ["pytest>=8,<10"]
test-command = "python -m pytest {project}/tests/test_python.py -q"
enable = []

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
musllinux-x86_64-image = "musllinux_1_2"
musllinux-aarch64-image = "musllinux_1_2"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F"]
