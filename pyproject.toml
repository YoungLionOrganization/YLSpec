[build-system]
requires = ["scikit-build-core>=0.11,<1"]
build-backend = "scikit_build_core.build"

[project]
name = "ylspec"
dynamic = ["version"]
description = "Typed, native C-backed TOML 1.1 documents for standalone configuration and embedded metadata"
readme = {file = "python/README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "vendor/tomlc17/LICENSE"]
# Separate display names and mailboxes so older backends do not RFC 2047-encode
# Unicode names inside address fields that registry interfaces display verbatim.
authors = [{name = "Cavanşir Qurbanzadə"}, {name = "Cavanshirpro", email = "cavanshirpro@gmail.com"}]
maintainers = [{name = "Cavanşir Qurbanzadə"}, {name = "YoungLionOrganization"}, {name = "Cavanshirpro", email = "cavanshirpro@gmail.com"}]
keywords = ["ylspec", "metadata", "manifest", "configuration", "embedding", "toml"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: C", "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Operating System :: Microsoft :: Windows", "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS", "Typing :: Typed",
  "Intended Audience :: Developers", "Topic :: File Formats",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/YoungLionOrganization/YLSpec"
Repository = "https://github.com/YoungLionOrganization/YLSpec"
Documentation = "https://github.com/YoungLionOrganization/YLSpec/blob/main/docs/python-api.md"
Issues = "https://github.com/YoungLionOrganization/YLSpec/issues"
Changelog = "https://github.com/YoungLionOrganization/YLSpec/blob/main/CHANGELOG.md"
Releases = "https://github.com/YoungLionOrganization/YLSpec/releases"
Source = "https://github.com/YoungLionOrganization/YLSpec"
Security = "https://github.com/YoungLionOrganization/YLSpec/blob/main/SECURITY.md"
Authors = "https://github.com/YoungLionOrganization/YLSpec/blob/main/AUTHORS.md"

[tool.scikit-build]
minimum-version = "0.11"
wheel.packages = ["python/ylspec"]
wheel.py-api = "cp311"
install.components = ["python"]
cmake.args = ["-DYLSPEC_BUILD_PYTHON=ON", "-DYLSPEC_BUILD_CLI=OFF", "-DBUILD_TESTING=OFF", "-DBUILD_SHARED_LIBS=OFF"]
sdist.include = ["include/**", "src/**", "bindings/**", "vendor/**", "release/**", "cmake/**", "tests/**", "examples/**", "python/**", "CMakeLists.txt", "LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "release/release.json"
regex = '"version":\s*"(?P<value>[^"]+)"'

[tool.cibuildwheel]
build = ["cp311-*"]
skip = ["*-win32", "*-manylinux_i686", "*-musllinux_i686", "*-win_arm64"]
test-requires = ["pytest>=8,<10"]
test-command = "python -m pytest {project}/tests/test_python.py -q"
enable = []

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
musllinux-x86_64-image = "musllinux_1_2"
musllinux-aarch64-image = "musllinux_1_2"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F"]
